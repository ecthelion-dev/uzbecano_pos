<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chek</title>
  <style>
    @page {
      size: 72mm auto;
      margin: 0;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      color: #000;
      background: #fff;
      width: 72mm;
      padding: 3mm 2mm;
    }
    .center { text-align: center; }
    .bold { font-weight: bold; }
    .large { font-size: 14px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
    .small { font-size: 10px; }
    .tiny { font-size: 9px; color: #555; }
    .divider { border-top: 1px dashed #000; margin: 4px 0; }
    .row { display: flex; justify-content: space-between; padding: 1px 0; }
    .row .left { flex: 1; padding-right: 4px; }
    .row .right { white-space: nowrap; font-weight: bold; }
    .item-name { font-weight: bold; font-size: 12px; }
    .item-sub { font-size: 10px; color: #333; }
    .total-row { font-size: 14px; font-weight: 900; }
    .mt2 { margin-top: 4px; }
    .mt4 { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="center">
    <div class="large" id="shop-name">UZBECANO RESTORAN</div>
    <div class="small mt2" id="shop-address">Toshkent sh., Markaziy filial</div>
    <div class="small" id="shop-phone">Tel: +998 90 123 45 67</div>
    <div class="small bold mt2" id="waiter-name"></div>
  </div>

  <div class="divider"></div>

  <div class="row bold">
    <span id="table-name"></span>
    <span id="payment-status"></span>
    <span id="order-time"></span>
  </div>

  <div class="divider"></div>

  <div id="items-list"></div>

  <div class="divider"></div>

  <div class="row small">
    <span>Jami taomlar:</span>
    <span id="subtotal" class="bold"></span>
  </div>
  <div class="row small" id="discount-row" style="display:none">
    <span id="discount-label">Chegirma:</span>
    <span id="discount-value" class="bold"></span>
  </div>
  <div class="row small">
    <span id="service-label">Xizmat haqi (10%):</span>
    <span id="service-value" class="bold"></span>
  </div>

  <div class="divider"></div>

  <div class="row total-row">
    <span>JAMI TO'LOV:</span>
    <span id="grand-total"></span>
  </div>
  <div class="row small mt2" id="cash-row" style="display:none">
    <span>Naqd:</span>
    <span id="cash-amount" class="bold"></span>
  </div>
  <div class="row small" id="card-row" style="display:none">
    <span>Karta:</span>
    <span id="card-amount" class="bold"></span>
  </div>
  <div class="row small mt2">
    <span>To'lov turi:</span>
    <span id="payment-method" class="bold"></span>
  </div>

  <div class="divider"></div>

  <div class="center mt4">
    <div class="small bold">Tashrifingiz uchun rahmat!</div>
    <div class="tiny mt2">Uzbecano POS v1.0</div>
  </div>

  <script>
    function fmt(n) {
      return Number(n || 0).toLocaleString('ru-RU') + " so'm";
    }

    const d = window.__receiptData;
    if (d) {
      document.getElementById('shop-name').textContent = d.shopName || 'UZBECANO RESTORAN';
      document.getElementById('shop-address').textContent = d.shopAddress || 'Toshkent sh., Markaziy filial';
      document.getElementById('shop-phone').textContent = d.shopPhone || 'Tel: +998 90 123 45 67';
      document.getElementById('waiter-name').textContent = d.waiterName ? 'Ofitsiant: ' + d.waiterName : '';
      document.getElementById('table-name').textContent = d.tableName || '';
      document.getElementById('payment-status').textContent = (d.paymentMethod || 'NAQD').toUpperCase() + " \u2022 TO'LANGAN";
      document.getElementById('order-time').textContent = d.time || '';

      const list = document.getElementById('items-list');
      (d.items || []).forEach(i => {
        const total = (Number(i.price) || 0) * (Number(i.quantity) || 1);
        const div = document.createElement('div');
        div.style.marginBottom = '4px';
        div.innerHTML = `
          <div class="row">
            <span class="left item-name">${i.name}</span>
            <span class="right item-name">${fmt(total)}</span>
          </div>
          <div class="item-sub">${i.quantity || 1} x ${fmt(i.price)}${i.note ? '<br><b>Izoh: ' + i.note + '</b>' : ''}</div>
        `;
        list.appendChild(div);
      });

      document.getElementById('subtotal').textContent = fmt(d.subtotal);

      if (d.discountAmount > 0) {
        document.getElementById('discount-row').style.display = 'flex';
        document.getElementById('discount-label').textContent = 'Chegirma (' + (d.discountPercent || '') + '%):';
        document.getElementById('discount-value').textContent = '-' + fmt(d.discountAmount);
      }

      document.getElementById('service-label').textContent = 'Xizmat haqi (' + (d.serviceFeePercent || 10) + '%):';
      document.getElementById('service-value').textContent = fmt(d.serviceFee);
      document.getElementById('grand-total').textContent = fmt(d.grandTotal);
      document.getElementById('payment-method').textContent = (d.paymentMethod || 'NAQD').toUpperCase();

      if (d.paymentMethod === 'aralash') {
        document.getElementById('cash-row').style.display = 'flex';
        document.getElementById('card-row').style.display = 'flex';
        document.getElementById('cash-amount').textContent = fmt(d.cashAmount);
        document.getElementById('card-amount').textContent = fmt(d.cardAmount);
      }

      window.onload = () => {
        setTimeout(() => {
          window.print();
          setTimeout(() => window.close(), 800);
        }, 300);
      };
    }
  </script>
</body>
</html>
