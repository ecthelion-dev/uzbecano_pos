<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    OrderPlus belgisi.

    Bu fayl ilgari butunlay boshqa rasm edi — to'q sariq kvadrat ichida
    chiziqlar bilan chizilgan sanchqi shakli va sariq nuqta. Loyihaning
    boshqa hamma joyida esa mana shu to'rt doirali belgi ishlatiladi, ya'ni
    bitta ilova ikki xil belgi bilan yurardi.

    O'lchamlar favicon.png dan olindi (709px, 512 ga keltirilgan):
    burchak radiusi 172 -> 124, doira radiusi 123 -> 88.8, markazlar
    226/481 -> 164/348. Ranglar ham o'sha fayldan o'qildi.

    Kulrang va oq doiralar diagonal bo'yicha joylashgan: chap-yuqori bilan
    o'ng-past kulrang, qolgan ikkitasi oq.
  -->
  <rect width="512" height="512" rx="124" fill="#F7771E"/>
  <circle cx="164" cy="164" r="88.8" fill="#CCCCCC"/>
  <circle cx="348" cy="164" r="88.8" fill="#F7F7F7"/>
  <circle cx="164" cy="348" r="88.8" fill="#F7F7F7"/>
  <circle cx="348" cy="348" r="88.8" fill="#CCCCCC"/>
</svg>
