name: Build Windows EXE

# Shoxobchaga push — faqat build va artefakt (tekshirish uchun).
# Reliz esa faqat teg qo'yilganda chiqadi.
#
# Ilgari ikkalasi bitta ish edi va `tagName: v__VERSION__` tauri.conf.json
# dagi qotib qolgan "1.0.0" ni olardi: main ga har push bir xil `v1.0.0`
# relizini qayta yozib ketardi, ya'ni kafe qaysi build o'rnatganini
# aniqlashning imkoni yo'q edi.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Rust build'i keshsiz har safar noldan yig'iladi (~10 daqiqa).
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Eslatma: bu yerda TAURI_SIGNING_PRIVATE_KEY yo'q — u faqat
          # updater artefaktlarini imzolaydi, updater esa sozlanmagan.
          # Windows Authenticode imzosi butunlay boshqa narsa va u
          # tauri.conf.json > bundle > windows orqali beriladi (README ga qarang).
        with:
          # Reliz faqat teg push qilinganda yaratiladi.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('OrderPlus POS {0}', github.ref_name) || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && 'OrderPlus POS Windows Desktop Release' || '' }}
          # Reliz qoralama bo'lib chiqadi: nashr qilishdan oldin odam
          # o'rnatib ko'radi. Kassaga tekshirilmagan build tushmasligi kerak.
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orderplus-pos-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
