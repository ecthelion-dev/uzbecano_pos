[package]
name = "orderplus-pos"
# Ilova versiyasi bu yerdan olinmaydi: tauri.conf.json dagi
# "version": "../package.json" ustunlik qiladi. Bu maydonni sinxron ushlab
# turishga urinish faqat chalg'itadi — reliz paytida package.json bumb
# qilinadi-yu, bu yerdagi raqam eskirib qoladi.
version = "0.0.0"
description = "OrderPlus POS — restoran kassa tizimi"
authors = ["OrderPlus"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "orderplus_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
printers = "2.3.0"
